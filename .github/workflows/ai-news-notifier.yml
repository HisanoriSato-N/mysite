name: AI News Notifier

on:
  schedule:
    # 09:00 JST every day (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore notification state
        uses: actions/cache@v4
        with:
          path: .cache/ai-news-state.json
          key: ai-news-state-${{ github.run_id }}
          restore-keys: |
            ai-news-state-

      - name: Collect and notify AI news
        env:
          NEWS_WEBHOOK_URL: ${{ secrets.NEWS_WEBHOOK_URL }}
          NEWS_WEBHOOK_TYPE: ${{ vars.NEWS_WEBHOOK_TYPE || 'auto' }}
          NEWS_TIMEZONE: Asia/Tokyo
          NEWS_MAX_ITEMS: ${{ vars.NEWS_MAX_ITEMS || '8' }}
          NEWS_LOOKBACK_HOURS: ${{ vars.NEWS_LOOKBACK_HOURS || '30' }}
          NEWS_SOURCES_JSON: ${{ vars.NEWS_SOURCES_JSON }}
        run: npm run ai-news
