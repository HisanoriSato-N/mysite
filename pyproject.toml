[project]
name = "gmail-draft-agent"
version = "0.1.0"
description = "24/7 Gmail monitor that drafts AI replies and notifies a human reviewer."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "openai>=1.35.0",
  "requests>=2.32.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
gmail-draft-agent = "gmail_draft_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
