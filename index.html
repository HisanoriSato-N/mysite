<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI News Notifier</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, #2563eb 0, transparent 28rem), #0f172a;
      }

      main {
        width: min(920px, calc(100% - 32px));
        padding: 48px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
      }

      p {
        color: #cbd5e1;
        font-size: 1.1rem;
        line-height: 1.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 32px;
      }

      .card {
        padding: 20px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI News Notifier</h1>
      <p>
        毎朝9時（JST）にAI関連ニュースをRSSから自動収集し、Slack・Discord・TeamsなどのWebhookへ通知します。
      </p>
      <div class="grid" aria-label="features">
        <section class="card">
          <h2>自動収集</h2>
          <p>主要AIニュースRSSから直近の記事を取得し、AIキーワードで抽出します。</p>
        </section>
        <section class="card">
          <h2>9時通知</h2>
          <p>GitHub Actionsのスケジュールで毎日 <code>09:00 JST</code> に実行します。</p>
        </section>
        <section class="card">
          <h2>重複防止</h2>
          <p>通知済みURLをキャッシュし、同じ記事の再通知を抑えます。</p>
        </section>
      </div>
    </main>
  </body>
</html>
